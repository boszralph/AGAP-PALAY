{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 p-4">
                <div class="card-body">
                    <i class="fas fa-exclamation-circle text-danger fa-5x mb-4"></i>
                    <h3 class="mb-3">{{ _('Invalid or Expired Link') }}</h3>
                    <p class="text-muted mb-4">
                        {{ _('The verification link is invalid or has expired.') }}
                    </p>
                    <p class="text-muted small">
                        {{ _('Please register again or request a new verification email.') }}
                    </p>
                    <hr>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-primary mt-2">
                        <i class="fas fa-user-plus me-2"></i>{{ _('Register Again') }}
                    </a>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-secondary mt-2">
                        <i class="fas fa-sign-in-alt me-2"></i>{{ _('Go to Login') }}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
