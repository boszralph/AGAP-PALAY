{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-lg-5 col-md-7 col-11">
            <div class="card login-card">
                <div class="card-header login-card-header">
                    <i class="fas fa-sign-in-alt me-2"></i>{{ 'Login' | translate }}
                </div>
                <div class="card-body login-card-body">
                    <form method="post">
                        <div class="form-group mb-3">
                            <label for="email" class="form-label">{{ 'Email address' | translate }}</label>
                            <div class="input-icon-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" class="form-control" id="email" name="email" placeholder="{{ 'Enter your email' | translate }}" required>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="password" class="form-label">{{ 'Password' | translate }}</label>
                            <div class="input-icon-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-control" id="password" name="password" placeholder="{{ 'Enter your password' | translate }}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i>{{ 'Login' | translate }}
                        </button>
                    </form>
                    <p class="mt-3 text-center login-footer-text">
                        {{ "Don't have an account?" | translate }} <a href="{{ url_for('register') }}" class="login-link">{{ 'Register here' | translate }}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Page-specific fine-tuning -->
<style>
    .min-vh-75 {
        min-height: 75vh;
    }

    .login-card {
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--card-bg);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        transition: box-shadow var(--transition-base);
    }

        .login-card:hover {
            box-shadow: var(--shadow-lg);
        }

    .login-card-header {
        background: var(--gradient-primary);
        border-bottom: none;
        padding: var(--space-4) var(--space-5);
        font-weight: 700;
        font-family: var(--font-heading);
        font-size: 1.25rem;
        color: white;
        display: flex;
        align-items: center;
        letter-spacing: -0.3px;
    }

        .login-card-header i {
            color: rgba(255, 255, 255, 0.8);
        }

    .login-card-body {
        padding: var(--space-5);
    }

    .form-label {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: var(--space-1);
        display: block;
    }

    .input-icon-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

        .input-icon-wrapper .input-icon {
            position: absolute;
            left: var(--space-3);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: color var(--transition-fast);
        }

        .input-icon-wrapper .form-control {
            padding-left: calc(var(--space-3) + 1.8rem);
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            min-height: 46px;
            transition: all var(--transition-fast);
            font-size: 0.95rem;
            width: 100%;
        }

            .input-icon-wrapper .form-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(30, 122, 58, 0.12);
                outline: none;
            }

                .input-icon-wrapper .form-control:focus + .input-icon,
                .input-icon-wrapper .form-control:focus ~ .input-icon {
                    color: var(--primary);
                }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-5);
        border-radius: var(--radius-md);
        font-weight: 600;
        font-size: 0.95rem;
        transition: all var(--transition-fast);
        border: none;
        cursor: pointer;
        text-decoration: none;
        font-family: var(--font-family);
        line-height: 1.5;
        min-height: 46px;
    }

    .btn-primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: 0 2px 8px rgba(30, 122, 58, 0.25);
    }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(30, 122, 58, 0.35);
            color: white;
        }

    .login-footer-text {
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .login-link {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: color var(--transition-fast);
    }

        .login-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

    /* Dark mode */
    body.dark-mode .login-card {
        border-color: var(--border);
        background: var(--card-bg);
    }

    body.dark-mode .login-card-header {
        background: var(--gradient-primary);
    }

    body.dark-mode .input-icon-wrapper .form-control {
        background: var(--card-bg);
        color: var(--text);
        border-color: var(--border);
    }

        body.dark-mode .input-icon-wrapper .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(30, 122, 58, 0.2);
        }

    body.dark-mode .login-link {
        color: var(--primary-light);
    }

        body.dark-mode .login-link:hover {
            color: var(--primary);
        }

    /* Responsive */
    @media (max-width: 576px) {
        .min-vh-75 {
            min-height: 70vh;
        }

        .login-card-body {
            padding: var(--space-4);
        }

        .login-card-header {
            font-size: 1.1rem;
            padding: var(--space-3) var(--space-4);
        }

        .btn {
            font-size: 0.9rem;
            min-height: 42px;
        }

        .input-icon-wrapper .form-control {
            font-size: 0.9rem;
            min-height: 42px;
        }
    }
</style>
{% endblock %}
