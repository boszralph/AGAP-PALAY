{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm border-0 p-4">
                <div class="card-body">
                    <i class="fas fa-check-circle text-success fa-5x mb-4"></i>
                    <h3 class="mb-3">{{ _('Email Verified Successfully!') }}</h3>
                    <p class="text-muted mb-4">
                        {{ _('Your email has been verified. You can now log in from any device.') }}
                    </p>
                    <p class="text-muted small">
                        <i class="fas fa-info-circle me-1"></i>
                        {{ _('You can close this tab and log in from your main device.') }}
                    </p>
                    <hr>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-success mt-2">
                        <i class="fas fa-sign-in-alt me-2"></i>{{ _('Go to Login') }}
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
