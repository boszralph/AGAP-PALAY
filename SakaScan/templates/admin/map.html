{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-0 px-sm-3">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 px-3 px-sm-0">
        <h1 class="page-title">
            <i class="fas fa-map-marked-alt me-2 text-primary"></i>{{ 'Disease Scan Map' | translate }}
        </h1>
        <span class="text-muted small" id="scanCount">{{ scans|length }} {{ 'scans' | translate }}</span>
    </div>

    <!-- Filter Bar – only disease + barangay -->
    <div class="card mb-2 border-0 shadow-sm">
        <div class="card-body py-2 px-3">
            <div class="row g-1 g-sm-2 align-items-center">
                <div class="col-6 col-sm-5 col-md-4">
                    <select id="diseaseFilter" class="form-select form-select-sm w-100">
                        <option value="all">{{ 'All Diseases' | translate }}</option>
                        {% set disease_names = scans | map(attribute='predicted_name') | unique | list %}
                        {% for name in disease_names %}
                        {% if name and name not in ['Not Rice Leaf', 'Insect Damage'] %}
                        <option value="{{ name }}">{{ name }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6 col-sm-5 col-md-4">
                    <select id="barangayFilter" class="form-select form-select-sm w-100">
                        <option value="all">{{ 'All Barangays' | translate }}</option>
                        {% for b in barangays %}
                        <option value="{{ b }}">{{ b }}</option>
                        {% endfor %}
                    </select>
                </div>
                <!-- no button here – it's now on the map -->
            </div>
        </div>
    </div>

    <!-- Map -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0 position-relative" style="min-height: 400px;">
            <div id="mapLoading" class="map-loading-overlay">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading map...</span>
                </div>
                <span class="ms-2">Loading map...</span>
            </div>
            <div id="diseaseMap" style="width: 100%; height: 600px; min-height: 400px; border-radius: var(--radius-lg); overflow: hidden;"></div>
        </div>
    </div>
</div>

<!-- Leaflet + plugins -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
    .page-title {
        font-weight: 700;
        font-size: 1.4rem;
        margin: 0;
        color: var(--text);
    }

    .card {
        border-radius: var(--radius-lg);
        background: var(--card-bg);
        transition: box-shadow var(--transition-base);
    }

    .card-body {
        padding: var(--space-3) var(--space-4);
    }

        .card-body.p-0 {
            padding: 0;
            position: relative;
            min-height: 400px;
        }

    .form-select-sm {
        font-size: 0.8rem;
        padding: 0.25rem 0.5rem;
        min-height: 32px;
        border-radius: var(--radius-sm);
        border: 1.5px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
        transition: all var(--transition-fast);
        cursor: pointer;
        width: 100%;
    }

        .form-select-sm:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30,122,58,0.12);
            outline: none;
        }

    .map-loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.85);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        font-size: 1rem;
        color: var(--text-secondary);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(2px);
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

        .map-loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

    body.dark-mode .map-loading-overlay {
        background: rgba(0,0,0,0.7);
        color: #e6edf3;
    }

    /* Legend – includes risk levels */
    .legend {
        background: var(--card-bg) !important;
        border: 1px solid var(--border) !important;
        box-shadow: var(--shadow-md) !important;
        border-radius: var(--radius-md) !important;
        padding: var(--space-2) var(--space-3) !important;
        max-height: 300px;
        overflow-y: auto;
        min-width: 150px;
        font-size: 0.75rem;
    }

        .legend h6 {
            font-weight: 700;
            margin-bottom: var(--space-1);
            font-size: 0.8rem;
            color: var(--text) !important;
        }

        .legend hr {
            border-color: var(--border) !important;
            margin: var(--space-1) 0;
        }

        .legend .count {
            color: var(--text-secondary) !important;
            font-weight: 600;
        }

        .legend .boundary-legend {
            color: var(--text-muted) !important;
            font-size: 0.7rem;
        }

            .legend .boundary-legend i {
                background: #2c3e50;
                border: 1px solid #2c3e50;
                width: 16px;
                height: 3px;
                border-radius: 0;
                display: inline-block;
                margin-right: 6px;
                vertical-align: middle;
            }

    .legend-item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 2px 0;
        border-bottom: 1px solid rgba(0,0,0,0.03);
        font-size: 0.75rem;
        color: var(--text);
    }

        .legend-item:last-child {
            border-bottom: none;
        }

    .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(0,0,0,0.1);
        flex-shrink: 0;
    }

    .legend-highlight {
        color: #e74c3c;
        font-weight: 600;
    }

        .legend-highlight i {
            background: #e74c3c;
            border: 1px solid #e74c3c;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
        }

    /* Risk legend items */
    .risk-legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        font-size: 0.75rem;
        color: var(--text);
    }

    .risk-color-box {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        border: 1px solid rgba(0,0,0,0.1);
        flex-shrink: 0;
    }

    .no-data-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(2px);
        border-radius: var(--radius-lg);
        text-align: center;
        padding: var(--space-4);
        z-index: 500;
    }

        .no-data-overlay i {
            font-size: 2.5rem;
            color: var(--text-muted);
            opacity: 0.4;
            margin-bottom: var(--space-2);
        }

        .no-data-overlay h5,
        .no-data-overlay p {
            color: var(--text-secondary);
        }

    /* ===== DARK MODE FIXES ===== */
    body.dark-mode .legend {
        background: var(--card-bg) !important;
        border-color: var(--border) !important;
    }

        body.dark-mode .legend h6 {
            color: #e6edf3 !important;
        }

        body.dark-mode .legend .count {
            color: #8b949e !important;
        }

        body.dark-mode .legend .legend-item {
            color: #e6edf3 !important;
        }

        body.dark-mode .legend .boundary-legend {
            color: #8b949e !important;
        }

            body.dark-mode .legend .boundary-legend i {
                background: #8b949e;
                border-color: #8b949e;
            }

        body.dark-mode .legend .legend-highlight {
            color: #f85149 !important;
        }

            body.dark-mode .legend .legend-highlight i {
                background: #f85149;
                border-color: #f85149;
            }

    body.dark-mode .no-data-overlay {
        background: rgba(0, 0, 0, 0.7);
    }

        body.dark-mode .no-data-overlay h5,
        body.dark-mode .no-data-overlay p {
            color: #e6edf3 !important;
        }

        body.dark-mode .no-data-overlay i {
            color: #e6edf3;
            opacity: 0.5;
        }

    /* Custom locate control */
    .leaflet-control-locate {
        background: var(--card-bg) !important;
        border: 1px solid var(--border) !important;
        border-radius: var(--radius-sm) !important;
        box-shadow: var(--shadow-sm) !important;
        width: 34px;
        height: 34px;
        display: flex !important;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition-fast);
        color: var(--text);
        font-size: 1.1rem;
    }

        .leaflet-control-locate:hover {
            background: var(--gradient-primary-subtle) !important;
            border-color: var(--primary) !important;
            color: var(--primary);
        }

    .leaflet-touch .leaflet-control-locate {
        width: 44px;
        height: 44px;
        font-size: 1.4rem;
    }

    body.dark-mode .leaflet-control-locate {
        background: var(--card-bg) !important;
        border-color: var(--border) !important;
        color: var(--text);
    }

        body.dark-mode .leaflet-control-locate:hover {
            background: rgba(30,122,58,0.2) !important;
            border-color: var(--primary-light) !important;
            color: var(--primary-light);
        }

    /* Responsive */
    @media (max-width: 576px) {
        .container-fluid.px-0 {
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .card {
            border-radius: 0 !important;
            border-left: none !important;
            border-right: none !important;
            box-shadow: none !important;
        }

        .card-body.p-0 {
            border-radius: 0 !important;
        }

        #diseaseMap {
            border-radius: 0 !important;
            height: 75vh !important;
            min-height: 400px !important;
        }

        .card-body.p-0 {
            min-height: 400px !important;
        }

        .page-title {
            font-size: 1.1rem;
        }

        .form-select-sm {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            min-height: 28px;
        }

        .legend {
            font-size: 0.65rem;
            max-height: 160px;
            min-width: 110px;
            padding: var(--space-1) var(--space-2) !important;
        }

            .legend h6 {
                font-size: 0.7rem;
            }

        .legend-item {
            font-size: 0.6rem;
        }

        .legend-color {
            width: 10px;
            height: 10px;
        }

        .col-6 {
            flex: 0 0 50%;
            max-width: 50%;
        }
    }

    @media (max-width: 400px) {
        #diseaseMap {
            height: 70vh !important;
            min-height: 350px !important;
        }

        .card-body.p-0 {
            min-height: 350px !important;
        }

        .legend {
            max-height: 140px;
            min-width: 100px;
        }
    }

    @media (min-width: 577px) and (max-width: 768px) {
        #diseaseMap {
            height: 500px !important;
            min-height: 400px !important;
        }

        .card-body.p-0 {
            min-height: 400px !important;
        }
    }

    @media (min-width: 769px) {
        #diseaseMap {
            height: 600px !important;
            min-height: 500px !important;
        }

        .card-body.p-0 {
            min-height: 500px !important;
        }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ---- 1. Data ----
    const allScans = {{ scans | tojson | safe }};
    const scans = allScans.filter(s =>
        s.predicted_name !== 'Not Rice Leaf' &&
        s.predicted_name !== 'Insect Damage'
    );
    const selectedBarangay = "{{ selected_barangay }}";
    const isMobile = window.innerWidth <= 576;

    // ---- RISK DATA from Flask ----
    const riskSummary = {{ risk_summary | tojson | safe }};
    const diseaseRisks = {{ disease_risks | tojson | safe }};

    // ---- 2. DOM refs ----
    const loadingEl = document.getElementById('mapLoading');
    const diseaseFilter = document.getElementById('diseaseFilter');
    const barangayFilter = document.getElementById('barangayFilter');
    const scanCount = document.getElementById('scanCount');

    // ---- 3. Map init ----
    const map = L.map('diseaseMap', {
        zoomControl: !isMobile,
        attributionControl: true
    }).setView([16.1558, 119.9808], 13);

    if (isMobile) {
        L.control.zoom({ position: 'topright' }).addTo(map);
    }
    map.setMinZoom(11);

    L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // ---- 4. Locate control ----
    const LocateControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function(map) {
            const container = L.DomUtil.create('div', 'leaflet-control-locate');
            container.innerHTML = '<i class="fas fa-crosshairs"></i>';
            container.title = '{{ "Go to my location" | translate }}';
            container.style.cursor = 'pointer';
            L.DomEvent.on(container, 'click', function(e) {
                L.DomEvent.stopPropagation(e);
                locateUser();
            });
            return container;
        }
    });
    map.addControl(new LocateControl());

    function locateUser() {
        map.locate({ setView: true, maxZoom: 16, timeout: 10000, enableHighAccuracy: true });
        map.once('locationfound', function(e) {
            L.circleMarker([e.latlng.lat, e.latlng.lng], {
                radius: 8,
                color: '#2e7d32',
                fillColor: '#2e7d32',
                fillOpacity: 0.8,
                weight: 2
            }).addTo(map).bindPopup('You are here').openPopup();
        });
        map.once('locationerror', function() {
            alert('Unable to retrieve location. Check permissions and HTTPS.');
        });
    }

    // ---- 5. Marker cluster ----
    const markers = L.markerClusterGroup({
        maxClusterRadius: 60,
        spiderfyOnMaxZoom: true,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            const size = isMobile ? 28 : 34;
            const fontSize = isMobile ? 10 : 13;
            return L.divIcon({
                html: `<div style="background:#1e7a3a;color:#fff;border-radius:50%;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${fontSize}px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.25);">${count}</div>`,
                className: 'marker-cluster-custom',
                iconSize: L.point(size, size)
            });
        }
    });

    // ---- 6. Helpers ----
    function getColor(diseaseName) {
        const colors = {
            'Bacterial Leaf Blight': '#e74c3c',
            'Brown Spot': '#f39c12',
            'Healthy': '#2ecc71',
            'Leaf Smut': '#8e44ad',
            'Rice Blast': '#3498db',
            'Tungro Virus': '#e67e22',
            'Healthy Rice Leaf': '#2ecc71',
            'Sheath Blight': '#1abc9c',
            'Leaf Scald': '#9b59b6',
            'Narrow Brown Leaf Spot': '#e67e22'
        };
        if (colors[diseaseName]) return colors[diseaseName];
        let hash = 0;
        for (let i = 0; i < diseaseName.length; i++) {
            hash = diseaseName.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h = Math.abs(hash) % 360;
        return `hsl(${h}, 70%, 50%)`;
    }

    function formatDate(d) {
        const date = new Date(d);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) +
               ' ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function getRiskLevel(reports, farmers) {
        if (reports >= 10 && farmers >= 5) {
            return { level: 'Very High', color: '#dc3545' };
        } else if (reports >= 6 && farmers >= 3) {
            return { level: 'High', color: '#fd7e14' };
        } else if (reports >= 3 && farmers >= 2) {
            return { level: 'Moderate', color: '#ffc107' };
        } else {
            return { level: 'Low', color: '#28a745' };
        }
    }

    // Build lookup for risk colors
    const riskLookup = {};
    riskSummary.forEach(r => {
        const risk = getRiskLevel(r.total_reports, r.unique_farmers);
        riskLookup[r.barangay] = risk;
    });

    function buildMarkers(filteredScans) {
        markers.clearLayers();
        let added = 0;
        filteredScans.forEach(function(scan) {
            const lat = parseFloat(scan.latitude);
            const lng = parseFloat(scan.longitude);
            if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                const diseaseName = scan.predicted_name || 'Unknown';
                const color = getColor(diseaseName);
                const icon = L.circleMarker([lat, lng], {
                    radius: isMobile ? 6 : 9,
                    fillColor: color,
                    color: '#fff',
                    weight: 1.5,
                    fillOpacity: 0.85
                });
                const popupContent = `
                    <div style="min-width:160px; max-width:240px;">
                        <h6 style="color:${color};margin:0 0 4px 0;font-size:${isMobile ? '0.85rem' : '0.95rem'};">${diseaseName}</h6>
                        <hr style="margin:4px 0;">
                        <p style="margin:2px 0;font-size:${isMobile ? '0.75rem' : '0.8rem'};">
                            <strong>Scan Location:</strong> ${scan.scan_location || 'Unknown'}
                        </p>
                        <p style="margin:2px 0;font-size:${isMobile ? '0.75rem' : '0.8rem'};">
                            <strong>Confidence:</strong> ${(scan.confidence * 100).toFixed(1)}%
                        </p>
                        <p style="margin:2px 0;font-size:0.7rem;color:#666;">
                            <strong>Date:</strong> ${formatDate(scan.created_at)}
                        </p>
                    </div>
                `;
                icon.bindPopup(popupContent, { maxWidth: 260 });
                markers.addLayer(icon);
                added++;
            }
        });
        map.addLayer(markers);
        return added;
    }

    function getFilteredScans() {
        const disease = diseaseFilter.value;
        const barangay = barangayFilter.value;
        return scans.filter(s => {
            let match = true;
            if (disease !== 'all') match = match && (s.predicted_name === disease);
            if (barangay !== 'all') match = match && (s.scan_location === barangay);
            return match;
        });
    }

    // ---- 7. Barangay layer & risk coloring ----
    let barangayLayer = null;
    const defaultStyle = {
        color: '#2c3e50',
        weight: isMobile ? 1.2 : 1.8,
        opacity: 0.6,
        fillColor: '#bdc3c7',
        fillOpacity: 0.06
    };
    const highlightStyle = {
        color: '#e74c3c',
        weight: isMobile ? 3 : 4,
        opacity: 1,
        fillColor: '#e74c3c',
        fillOpacity: 0.15
    };

    function updateBarangayHighlight() {
        const selected = barangayFilter.value;
        if (!barangayLayer) return;
        barangayLayer.eachLayer(function(layer) {
            const name = layer.feature?.properties?.ADM4_EN;
            if (!name) return;
            if (selected !== 'all' && name.toLowerCase() === selected.toLowerCase()) {
                layer.setStyle(highlightStyle);
                if (selected !== 'all') {
                    try { map.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 15 }); } catch (e) {}
                }
            } else {
                // Apply risk color (if any) otherwise default
                const risk = riskLookup[name];
                if (risk) {
                    layer.setStyle({
                        color: risk.color,
                        weight: 2,
                        opacity: 0.8,
                        fillColor: risk.color,
                        fillOpacity: 0.3
                    });
                } else {
                    layer.setStyle(defaultStyle);
                }
            }
        });
    }

    // ---- 8. Legend (disease + risk) ----
    let legendControl = null;
    function updateLegend(filteredScans) {
        if (legendControl) {
            map.removeControl(legendControl);
            legendControl = null;
        }
        const diseaseCounts = {};
        filteredScans.forEach(s => {
            const name = s.predicted_name || 'Unknown';
            diseaseCounts[name] = (diseaseCounts[name] || 0) + 1;
        });

        legendControl = L.control({ position: 'bottomright' });
        legendControl.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            let html = '<h6>Disease Cases</h6>';
            const sorted = Object.entries(diseaseCounts).sort((a, b) => b[1] - a[1]);
            if (sorted.length === 0) {
                html += '<div class="text-muted small">No disease scans</div>';
            } else {
                sorted.forEach(([name, count]) => {
                    const color = getColor(name);
                    html += `<div class="legend-item">
                        <span class="legend-color" style="background:${color};"></span>
                        ${name} <span class="count">(${count})</span>
                    </div>`;
                });
            }
            html += `<hr><div class="risk-legend-item"><span class="risk-color-box" style="background:#28a745;"></span> Low</div>
                     <div class="risk-legend-item"><span class="risk-color-box" style="background:#ffc107;"></span> Moderate</div>
                     <div class="risk-legend-item"><span class="risk-color-box" style="background:#fd7e14;"></span> High</div>
                     <div class="risk-legend-item"><span class="risk-color-box" style="background:#dc3545;"></span> Very High</div>
                     <hr><div class="boundary-legend"><i></i> Barangay boundaries</div>`;
            const selected = barangayFilter.value;
            if (selected && selected !== 'all') {
                html += `<div class="legend-highlight"><i style="background:#e74c3c;"></i> ${selected}</div>`;
            }
            div.innerHTML = html;
            return div;
        };
        legendControl.addTo(map);
    }

    // ---- 9. No-data overlay ----
    let noDataOverlay = null;
    function toggleNoData(show) {
        const container = document.querySelector('.card-body.p-0');
        if (show) {
            if (!noDataOverlay) {
                noDataOverlay = document.createElement('div');
                noDataOverlay.className = 'no-data-overlay';
                noDataOverlay.innerHTML = `
                    <i class="fas fa-map-pin"></i>
                    <h5 class="text-muted">No disease scans match filters</h5>
                    <p class="text-muted small">Try adjusting the filters above.</p>
                `;
                container.appendChild(noDataOverlay);
            }
            noDataOverlay.style.display = 'flex';
        } else {
            if (noDataOverlay) noDataOverlay.style.display = 'none';
        }
    }

    // ---- 10. Update map ----
    function updateMap() {
        const filtered = getFilteredScans();
        const added = buildMarkers(filtered);
        scanCount.textContent = filtered.length + ' scans';
        updateBarangayHighlight();
        updateLegend(filtered);
        toggleNoData(filtered.length === 0);
        if (added > 0) {
            try {
                const group = new L.featureGroup(
                    filtered.map(s => L.circleMarker([parseFloat(s.latitude), parseFloat(s.longitude)]))
                );
                map.fitBounds(group.getBounds().pad(0.1));
            } catch (e) {}
        }
    }

    // ---- 11. Filter events ----
    diseaseFilter.addEventListener('change', updateMap);
    barangayFilter.addEventListener('change', updateMap);

    // ---- 12. Load GeoJSON and apply risk ----
    const geoJsonUrl = '/static/data/barangays-municity-ph015503000.0.1.json';
    fetch(geoJsonUrl)
        .then(res => {
            if (!res.ok) throw new Error('GeoJSON not found');
            return res.json();
        })
        .then(data => {
            // Define style with risk colors
            const riskStyle = function(feature) {
                const name = feature.properties.ADM4_EN;
                const risk = riskLookup[name];
                if (risk) {
                    return {
                        color: risk.color,
                        weight: 2,
                        opacity: 0.8,
                        fillColor: risk.color,
                        fillOpacity: 0.3
                    };
                }
                return defaultStyle;
            };

            barangayLayer = L.geoJSON(data, {
                style: riskStyle,
                onEachFeature: function(feature, layer) {
                    const name = feature.properties.ADM4_EN;
                    // Tooltip with barangay name
                    layer.bindTooltip(name, { permanent: false, direction: 'center', className: 'barangay-label' });

                    // Popup with disease risk details
                    const risks = diseaseRisks.filter(r => r.barangay === name);
                    let popupContent = `<b>${name}</b><br>`;
                    if (risks.length === 0) {
                        popupContent += 'No recent disease reports.';
                    } else {
                        const total = riskLookup[name] ? riskLookup[name].level : 'Low';
                        popupContent += `Overall Risk: <strong>${total}</strong><br><br>`;
                        popupContent += '<b>Diseases:</b><ul>';
                        risks.forEach(r => {
                            const rl = getRiskLevel(r.report_count, r.unique_farmers);
                            popupContent += `<li>${r.disease}: ${rl.level} (${r.report_count} reports, ${r.unique_farmers} farmers)</li>`;
                        });
                        popupContent += '</ul>';
                    }
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);

            loadingEl.classList.add('hidden');
            if (selectedBarangay && selectedBarangay !== 'all') {
                barangayFilter.value = selectedBarangay;
            }
            const initial = getFilteredScans();
            buildMarkers(initial);
            updateBarangayHighlight();
            updateLegend(initial);
            toggleNoData(initial.length === 0);
            scanCount.textContent = initial.length + ' scans';
        })
        .catch(error => {
            console.error('GeoJSON error:', error);
            loadingEl.classList.add('hidden');
            if (selectedBarangay && selectedBarangay !== 'all') {
                barangayFilter.value = selectedBarangay;
            }
            const initial = getFilteredScans();
            buildMarkers(initial);
            updateLegend(initial);
            toggleNoData(initial.length === 0);
            scanCount.textContent = initial.length + ' scans';
        });

    // ---- 13. Resize ----
    let resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            const newIsMobile = window.innerWidth <= 576;
            map.invalidateSize();
            markers.eachLayer(function(layer) {
                if (layer.setRadius) layer.setRadius(newIsMobile ? 6 : 9);
            });
        }, 250);
    });

    console.log('Map ready with', scans.length, 'disease scans');
});
</script>
